
services:
  app:
    build:
      context: https://github.com/haiderali712000-code/ai-studio.git#main
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: Cliporra

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ai_studio
      DB_USER: aistudio_user
      DB_PASSWORD: Admin@123

      JWT_SECRET: hkhsaugdiuegiufgiywe77t47
      ADMIN_EMAILS: haiderali71200@gmail.com

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aistudio
      MYSQL_USER: aistudio_user
      MYSQL_PASSWORD: Haider@123
      MYSQL_ROOT_PASSWORD: Haider@123
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
